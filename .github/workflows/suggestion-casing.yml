name: French suggestion casing diagnostics

on:
  push:
    branches: [bench/french-suggestion-casing]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: french-suggestion-casing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  french:
    name: Casing and diagnostics (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - name: Record pinned compiler and check formatting
        id: formatting
        continue-on-error: true
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --all -- --check
      - name: Save formatted sources for review
        if: always()
        run: |
          rustfmt --edition 2024 --emit stdout crates/proof/src/fr/suggest.rs > suggest-formatted.rs
          rustfmt --edition 2024 --emit stdout crates/proof/examples/french_suggestion_diagnostics.rs > diagnostic-formatted.rs
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Runtime test input only: never commit or bundle the MPL dictionary in WordCraft.
      # Pin both the upstream revision and the bytes so a future dictionary update is reviewed.
      - name: Download and verify Dicollecte 7.7
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          revision = "67032ee957631908098a72edf48dc81cac27e369"
          base = f"https://raw.githubusercontent.com/LibreOffice/dictionaries/{revision}/fr_FR/dictionaries"
          directory = Path(os.environ["WORDCRAFT_DICTIONARIES"])
          directory.mkdir(parents=True, exist_ok=True)
          for name, sha256 in {
              "fr.aff": "c176610cd5dc4846806a65ddd029f422d87978bf58f224aa44222662a16a2de5",
              "fr.dic": "b78a868e31dd6e373b6c3217969afb898a9acde828a5e7ef97308da42218c88c",
          }.items():
              with urlopen(f"{base}/{name}", timeout=60) as response:
                  data = response.read(64 * 1024 * 1024 + 1)
              if hashlib.sha256(data).hexdigest() != sha256:
                  raise RuntimeError(f"Dictionary checksum mismatch: {name}")
              (directory / name).write_bytes(data)

      - name: Synthetic proofing and non-French compatibility regressions
        run: cargo test --locked -p wordcraft-proof

      - name: Clippy proofing and diagnostic targets
        run: cargo clippy --locked -p wordcraft-proof --all-targets -- -D warnings

      - name: Real dictionary suggestion diagnostic
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        run: cargo run --locked -p wordcraft-proof --example french_suggestion_diagnostics > suggestion-diagnostics.txt

      - name: Save diagnostic observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: french-suggestion-diagnostics-${{ matrix.os }}
          path: |
            suggestion-diagnostics.txt
            suggest-formatted.rs
            diagnostic-formatted.rs
          if-no-files-found: warn

      - name: Required real French dictionary gate
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        run: cargo test --locked -p wordcraft-proof --test french_dictionary -- --ignored

      - name: Review commands in French
        run: cargo test --locked -p wordcraft-engine --lib french_proofing_through_the_review_commands

      - name: Require formatting success
        if: steps.formatting.outcome != 'success'
        run: exit 1
