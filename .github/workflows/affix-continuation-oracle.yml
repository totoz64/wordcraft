name: Affix continuation oracle

on:
  push:
    branches: [bench/french-prefix-continuations]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install reference command-line executable
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends hunspell
      - name: Observe original prefix/suffix continuation fixtures
        run: python3 tools/affix-oracle/probe.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: affix-oracle-observations
          path: affix-oracle-observations.json

  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Check committed formatting
        run: |
          cargo fmt --all -- --check
      - name: Save proposed formatting when needed
        if: failure()
        run: |
          cargo fmt --all
          git diff -- crates/proof/src/affix.rs crates/proof/tests/prefix_continuations.rs

  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      CARGO_TARGET_DIR: target-affix-continuations
      WORDCRAFT_DICTIONARIES: /tmp/wordcraft-french-dictionary
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: clippy
      - name: Record compiler and obtain verified runtime dictionary
        shell: python
        run: |
          import hashlib, os, subprocess
          from pathlib import Path
          from urllib.request import urlopen
          subprocess.run(["rustc", "--version", "--verbose"], check=True)
          revision = "67032ee957631908098a72edf48dc81cac27e369"
          directory = Path(os.environ["WORDCRAFT_DICTIONARIES"])
          directory.mkdir(parents=True, exist_ok=True)
          for name, digest in {
              "fr.aff": "c176610cd5dc4846806a65ddd029f422d87978bf58f224aa44222662a16a2de5",
              "fr.dic": "b78a868e31dd6e373b6c3217969afb898a9acde828a5e7ef97308da42218c88c",
          }.items():
              with urlopen(f"https://raw.githubusercontent.com/LibreOffice/dictionaries/{revision}/fr_FR/dictionaries/{name}", timeout=60) as response:
                  data = response.read(64 * 1024 * 1024 + 1)
              if hashlib.sha256(data).hexdigest() != digest:
                  raise RuntimeError(f"checksum mismatch: {name}")
              (directory / name).write_bytes(data)
      - name: Full proofing suite including frozen historical compatibility
        run: cargo test --locked -p wordcraft-proof
      - name: Real dictionary and metric regressions
        run: |
          cargo test --locked -p wordcraft-proof --test french_dictionary -- --ignored
          cargo test --locked -p wordcraft-proof --test prefix_continuations -- --ignored
      - name: Proofing Clippy
        run: cargo clippy --locked -p wordcraft-proof --all-targets -- -D warnings
