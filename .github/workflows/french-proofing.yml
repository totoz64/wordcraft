name: French proofing

on:
  pull_request:
    paths:
      - 'Cargo*'
      - 'crates/proof/**'
      - 'assets/hyphenation/fr.pat'
      - 'apps/wordcraft/**'
      - 'crates/ui-egui/**'
      - 'crates/engine/src/cmd/review.rs'
      - 'crates/engine/src/tests.rs'
      - 'crates/engine/tests/french_grammar.rs'
      - 'crates/engine/tests/french_reflexive_auxiliary.rs'
      - 'crates/engine/tests/fr_mixed_context.rs'
      - 'crates/engine/tests/french_local_language_boundaries.rs'
      - 'crates/engine/tests/french_explicit_autonym_context.rs'
      - 'crates/engine/tests/french_nominal_review.rs'
      - 'crates/engine/tests/french_nominal_negative_review.rs'
      - 'crates/engine/tests/french_nominal_clitic_review.rs'
      - 'crates/engine/tests/french_structured_subjects_review.rs'
      - 'docs/french-proofing.md'
      - 'docs/spelling-dictionaries.md'
      - '.github/workflows/french-proofing.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo*'
      - 'crates/proof/**'
      - 'assets/hyphenation/fr.pat'
      - 'apps/wordcraft/**'
      - 'crates/ui-egui/**'
      - 'crates/engine/src/cmd/review.rs'
      - 'crates/engine/src/tests.rs'
      - 'crates/engine/tests/french_grammar.rs'
      - 'crates/engine/tests/french_reflexive_auxiliary.rs'
      - 'crates/engine/tests/fr_mixed_context.rs'
      - 'crates/engine/tests/french_local_language_boundaries.rs'
      - 'crates/engine/tests/french_explicit_autonym_context.rs'
      - 'crates/engine/tests/french_nominal_review.rs'
      - 'crates/engine/tests/french_nominal_negative_review.rs'
      - 'crates/engine/tests/french_nominal_clitic_review.rs'
      - 'crates/engine/tests/french_structured_subjects_review.rs'
      - 'docs/french-proofing.md'
      - 'docs/spelling-dictionaries.md'
      - '.github/workflows/french-proofing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: french-proofing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  french:
    name: French (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Record pinned compiler and check formatting
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Runtime test input only: never commit or bundle the MPL dictionary in WordCraft.
      # Pin both the upstream revision and the bytes so a future dictionary update is reviewed.
      - name: Download and verify Dicollecte 7.7
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          revision = "67032ee957631908098a72edf48dc81cac27e369"
          base = f"https://raw.githubusercontent.com/LibreOffice/dictionaries/{revision}/fr_FR/dictionaries"
          directory = Path(os.environ["WORDCRAFT_DICTIONARIES"])
          directory.mkdir(parents=True, exist_ok=True)
          for name, sha256 in {
              "fr.aff": "c176610cd5dc4846806a65ddd029f422d87978bf58f224aa44222662a16a2de5",
              "fr.dic": "b78a868e31dd6e373b6c3217969afb898a9acde828a5e7ef97308da42218c88c",
              "README_dict_fr.txt": "4a25abf740ad6ba5e8d0cfc0d2ffadc3c13c303f8fe389f323b061a389350f83",
          }.items():
              with urlopen(f"{base}/{name}", timeout=60) as response:
                  data = response.read(64 * 1024 * 1024 + 1)
              if hashlib.sha256(data).hexdigest() != sha256:
                  raise RuntimeError(f"Dictionary checksum mismatch: {name}")
              (directory / name).write_bytes(data)

      - name: Synthetic proofing and non-French compatibility regressions
        run: cargo test --locked -p wordcraft-proof

      # Optional verb and nominal linguistic data only (MPL-2.0), never Grammalecte's GPL grammar code.
      - name: Download and verify French verb and nominal morphology 7.7
        env:
          WORDCRAFT_FRENCH_MORPHOLOGY_DIR: ${{ runner.temp }}/wordcraft-french-morphology
        shell: python
        run: |
          import hashlib
          import io
          import os
          from pathlib import Path
          from urllib.request import urlopen
          import zipfile
          url = "https://www.grammalecte.net/dic/lexique-grammalecte-fr-v7.7.zip"
          expected = "bdccf2065e252010253171000a38de84581407896b6bc60aca7d4d69dab7e4d2"
          with urlopen(url, timeout=60) as response:
              archive = response.read(16 * 1024 * 1024 + 1)
          if len(archive) > 16 * 1024 * 1024 or hashlib.sha256(archive).hexdigest() != expected:
              raise RuntimeError("French lexicon archive size/checksum mismatch")
          directory = Path(os.environ["WORDCRAFT_FRENCH_MORPHOLOGY_DIR"])
          directory.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as data:
              for name, limit in {"lexique-grammalecte-fr-v7.7.txt": 64 * 1024 * 1024, "README_lexique.txt": 64 * 1024}.items():
                  if data.getinfo(name).file_size > limit:
                      raise RuntimeError("French lexicon member exceeds its size limit")
                  with data.open(name) as member:
                      contents = member.read(limit + 1)
                  if len(contents) > limit:
                      raise RuntimeError("French lexicon member exceeds its size limit")
                  (directory / name).write_bytes(contents)
          (directory / "lexique-grammalecte-fr-v7.7.zip").write_bytes(archive)

      - name: Required real French morphology gate
        env:
          WORDCRAFT_FRENCH_LEXICON: ${{ runner.temp }}/wordcraft-french-morphology/lexique-grammalecte-fr-v7.7.txt
        run: cargo test --locked -p wordcraft-proof --test french_morphology -- --ignored

      - name: Required real French subject agreement gate
        env:
          WORDCRAFT_FRENCH_LEXICON: ${{ runner.temp }}/wordcraft-french-morphology/lexique-grammalecte-fr-v7.7.txt
        run: cargo test --locked -p wordcraft-proof --test french_subject_agreement -- --ignored

      - name: Required real French clitic agreement gate
        env:
          WORDCRAFT_FRENCH_LEXICON: ${{ runner.temp }}/wordcraft-french-morphology/lexique-grammalecte-fr-v7.7.txt
        run: cargo test --locked -p wordcraft-proof --test french_clitic_agreement -- --ignored

      - name: Required real French written-pronoun context gate
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-morphology
        run: cargo test --locked -p wordcraft-proof --test french_written_pronouns_real -- --ignored

      - name: Required real French reflexive auxiliary gate
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-morphology
        run: cargo test --locked -p wordcraft-proof --test french_reflexive_auxiliary -- --ignored

      - name: Required real French dictionary gate
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        run: cargo test --locked -p wordcraft-proof --test french_dictionary -- --ignored

      - name: Review commands in French
        run: cargo test --locked -p wordcraft-engine --lib french_proofing_through_the_review_commands

      - name: Grammar suggestions, disable and undo
        run: cargo test --locked -p wordcraft-engine --test french_grammar

      - name: Reflexive auxiliary Review, marks and undo
        run: cargo test --locked -p wordcraft-engine --test french_reflexive_auxiliary

      - name: Desktop installation and activation
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        run: cargo test --locked -p wordcraft french_dictionary -- --include-ignored

      - name: Async installation state and preference persistence
        run: cargo test --locked -p wordcraft-ui-egui --test french_dictionary_setup

      - name: Native French grammar data installation
        env:
          WORDCRAFT_FRENCH_LEXICON_ARCHIVE: ${{ runner.temp }}/wordcraft-french-morphology/lexique-grammalecte-fr-v7.7.zip
        run: cargo test --locked -p wordcraft french_grammar_data -- --include-ignored

      - name: Grammar data activation and installation interlock
        run: cargo test --locked -p wordcraft-ui-egui --test french_grammar_setup

      - name: Prepare pinned mixed-context data
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          temporary = Path(os.environ["RUNNER_TEMP"])
          source = temporary / "wordcraft-french-morphology"
          directory = temporary / "wordcraft-french-dictionary"
          if not source.is_dir() or source.is_symlink() or not directory.is_dir() or directory.is_symlink():
              raise RuntimeError("Pinned French input directories are absent or linked")
          files = {
              "lexique-grammalecte-fr-v7.7.txt": (64 * 1024 * 1024, "dc1fa3740e6353bccdcb435ea8f1c8a65287726026abd53dd232d5d494548eff"),
              "README_lexique.txt": (64 * 1024, "2f12da0c8bd1c7899f75dc5437164f61e234b55133ccdfbac06dafbe7f531e8e"),
          }
          verified = {}
          for name, (limit, expected) in files.items():
              path = source / name
              if not path.is_file() or path.is_symlink() or path.stat().st_size > limit:
                  raise RuntimeError("Invalid bounded French input: " + name)
              with path.open("rb") as stream:
                  contents = stream.read(limit + 1)
              if len(contents) > limit or hashlib.sha256(contents).hexdigest() != expected:
                  raise RuntimeError("Pinned French input size/checksum mismatch: " + name)
              destination = directory / name
              if destination.exists():
                  if not destination.is_file() or destination.is_symlink() or destination.stat().st_size != len(contents):
                      raise RuntimeError("Unexpected existing French input: " + name)
                  with destination.open("rb") as stream:
                      existing = stream.read(limit + 1)
                  if hashlib.sha256(existing).hexdigest() != expected:
                      raise RuntimeError("Refusing to replace different French input: " + name)
              verified[name] = contents
          for name, contents in verified.items():
              destination = directory / name
              if not destination.exists():
                  with destination.open("xb") as stream:
                      stream.write(contents)

      - name: Required mixed French grammar context gate
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        run: cargo test --locked -p wordcraft-proof --test french_mixed_context_real -- --ignored

      - name: Required real French nominal agreement gate
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        run: cargo test --locked -p wordcraft-proof --test french_nominal_real -- --ignored

      - name: Required real French negative nominal subject gate
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        run: cargo test --locked -p wordcraft-proof --test french_nominal_negative_real -- --ignored

      - name: Mixed French grammar review context
        run: cargo test --locked -p wordcraft-engine --test fr_mixed_context

      - name: Local French grammar language boundaries and undo
        run: cargo test --locked -p wordcraft-engine --test french_local_language_boundaries

      - name: Explicit French word mentions and local review
        run: cargo test --locked -p wordcraft-engine --test french_explicit_autonym_context

      - name: Nominal French agreement Review, languages and undo
        run: cargo test --locked -p wordcraft-engine --test french_nominal_review

      - name: Negative nominal French subject Review, languages and undo
        run: cargo test --locked -p wordcraft-engine --test french_nominal_negative_review

      - name: Required real French nominal clitic gate
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        run: cargo test --locked -p wordcraft-proof --test french_nominal_clitic_real -- --ignored --nocapture

      - name: Nominal French clitic Review, languages and undo
        run: cargo test --locked -p wordcraft-engine --test french_nominal_clitic_review

      - name: Required real French structured subject gate
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        run: cargo test --locked -p wordcraft-proof --test french_structured_subjects_real -- --ignored --nocapture

      - name: Structured French subjects Review, languages and undo
        run: cargo test --locked -p wordcraft-engine --test french_structured_subjects_review
