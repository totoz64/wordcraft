name: French proofing

on:
  pull_request:
    paths:
      - 'Cargo*'
      - 'crates/proof/**'
      - 'assets/hyphenation/fr.pat'
      - 'apps/wordcraft/**'
      - 'crates/ui-egui/**'
      - 'crates/engine/src/cmd/review.rs'
      - 'crates/engine/src/tests.rs'
      - 'crates/engine/tests/french_grammar.rs'
      - 'docs/french-proofing.md'
      - 'docs/spelling-dictionaries.md'
      - '.github/workflows/french-proofing.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo*'
      - 'crates/proof/**'
      - 'assets/hyphenation/fr.pat'
      - 'apps/wordcraft/**'
      - 'crates/ui-egui/**'
      - 'crates/engine/src/cmd/review.rs'
      - 'crates/engine/src/tests.rs'
      - 'crates/engine/tests/french_grammar.rs'
      - 'docs/french-proofing.md'
      - 'docs/spelling-dictionaries.md'
      - '.github/workflows/french-proofing.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: french-proofing-${{ github.ref }}
  cancel-in-progress: true

jobs:
  french:
    name: French (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Record pinned compiler and check formatting
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Runtime test input only: never commit or bundle the MPL dictionary in WordCraft.
      # Pin both the upstream revision and the bytes so a future dictionary update is reviewed.
      - name: Download and verify Dicollecte 7.7
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        shell: python
        run: |
          import hashlib
          import os
          from pathlib import Path
          from urllib.request import urlopen
          revision = "67032ee957631908098a72edf48dc81cac27e369"
          base = f"https://raw.githubusercontent.com/LibreOffice/dictionaries/{revision}/fr_FR/dictionaries"
          directory = Path(os.environ["WORDCRAFT_DICTIONARIES"])
          directory.mkdir(parents=True, exist_ok=True)
          for name, sha256 in {
              "fr.aff": "c176610cd5dc4846806a65ddd029f422d87978bf58f224aa44222662a16a2de5",
              "fr.dic": "b78a868e31dd6e373b6c3217969afb898a9acde828a5e7ef97308da42218c88c",
              "README_dict_fr.txt": "4a25abf740ad6ba5e8d0cfc0d2ffadc3c13c303f8fe389f323b061a389350f83",
          }.items():
              with urlopen(f"{base}/{name}", timeout=60) as response:
                  data = response.read(64 * 1024 * 1024 + 1)
              if hashlib.sha256(data).hexdigest() != sha256:
                  raise RuntimeError(f"Dictionary checksum mismatch: {name}")
              (directory / name).write_bytes(data)

      - name: Synthetic proofing and non-French compatibility regressions
        run: cargo test --locked -p wordcraft-proof

      # Optional linguistic data only (MPL-2.0), never Grammalecte's GPL grammar code.
      - name: Download and verify French finite morphology 7.7
        env:
          WORDCRAFT_FRENCH_MORPHOLOGY_DIR: ${{ runner.temp }}/wordcraft-french-morphology
        shell: python
        run: |
          import hashlib
          import io
          import os
          from pathlib import Path
          from urllib.request import urlopen
          import zipfile
          url = "https://www.grammalecte.net/dic/lexique-grammalecte-fr-v7.7.zip"
          expected = "bdccf2065e252010253171000a38de84581407896b6bc60aca7d4d69dab7e4d2"
          with urlopen(url, timeout=60) as response:
              archive = response.read(16 * 1024 * 1024 + 1)
          if len(archive) > 16 * 1024 * 1024 or hashlib.sha256(archive).hexdigest() != expected:
              raise RuntimeError("French lexicon archive size/checksum mismatch")
          directory = Path(os.environ["WORDCRAFT_FRENCH_MORPHOLOGY_DIR"])
          directory.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(io.BytesIO(archive)) as data:
              for name, limit in {"lexique-grammalecte-fr-v7.7.txt": 64 * 1024 * 1024, "README_lexique.txt": 64 * 1024}.items():
                  if data.getinfo(name).file_size > limit:
                      raise RuntimeError("French lexicon member exceeds its size limit")
                  with data.open(name) as member:
                      contents = member.read(limit + 1)
                  if len(contents) > limit:
                      raise RuntimeError("French lexicon member exceeds its size limit")
                  (directory / name).write_bytes(contents)
          (directory / "lexique-grammalecte-fr-v7.7.zip").write_bytes(archive)

      - name: Required real French morphology gate
        env:
          WORDCRAFT_FRENCH_LEXICON: ${{ runner.temp }}/wordcraft-french-morphology/lexique-grammalecte-fr-v7.7.txt
        run: cargo test --locked -p wordcraft-proof --test french_morphology -- --ignored

      - name: Required real French subject agreement gate
        env:
          WORDCRAFT_FRENCH_LEXICON: ${{ runner.temp }}/wordcraft-french-morphology/lexique-grammalecte-fr-v7.7.txt
        run: cargo test --locked -p wordcraft-proof --test french_subject_agreement -- --ignored

      - name: Required real French dictionary gate
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        run: cargo test --locked -p wordcraft-proof --test french_dictionary -- --ignored

      - name: Review commands in French
        run: cargo test --locked -p wordcraft-engine --lib french_proofing_through_the_review_commands

      - name: Grammar suggestions, disable and undo
        run: cargo test --locked -p wordcraft-engine --test french_grammar

      - name: Desktop installation and activation
        env:
          WORDCRAFT_DICTIONARIES: ${{ runner.temp }}/wordcraft-french-dictionary
        run: cargo test --locked -p wordcraft french_dictionary -- --include-ignored

      - name: Async installation state and preference persistence
        run: cargo test --locked -p wordcraft-ui-egui --test french_dictionary_setup

      - name: Native French grammar data installation
        env:
          WORDCRAFT_FRENCH_LEXICON_ARCHIVE: ${{ runner.temp }}/wordcraft-french-morphology/lexique-grammalecte-fr-v7.7.zip
        run: cargo test --locked -p wordcraft french_grammar_data -- --include-ignored

      - name: Grammar data activation and installation interlock
        run: cargo test --locked -p wordcraft-ui-egui --test french_grammar_setup
