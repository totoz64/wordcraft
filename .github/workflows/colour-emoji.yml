name: Colour emoji

on:
  pull_request:
    paths:
      - 'Cargo*'
      - 'crates/fonts/**'
      - 'crates/layout/**'
      - 'crates/render/**'
      - '.github/workflows/colour-emoji.yml'
  push:
    branches: [main]
    paths:
      - 'Cargo*'
      - 'crates/fonts/**'
      - 'crates/layout/**'
      - 'crates/render/**'
      - '.github/workflows/colour-emoji.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: colour-emoji-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Colour emoji (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15-intel]
    env:
      CARGO_TERM_COLOR: never
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      WORDCRAFT_LANGUAGE: en
      # A green job must exercise real installed colour glyphs; absent fonts fail the tests.
      WORDCRAFT_REQUIRE_COLOUR_EMOJI: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the Linux colour emoji font
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-noto-color-emoji
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: '1.98.1'
          components: rustfmt
      - name: Record compiler and check formatting
        run: |
          rustc --version --verbose
          cargo --version
          cargo fmt --all -- --check
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: colour-emoji-native-v1
      - name: Font selection and fallback regressions
        run: cargo test --locked -p wordcraft-fonts
      - name: Real colour rendering and adjacent fallback regressions
        run: cargo test --locked -p wordcraft-render -- --nocapture
