{
  "name": "French school foundations",
  "on": {
    "push": {
      "branches": [
        "study/french-school-foundations"
      ],
      "paths": [
        "tools/french-school-foundations/**",
        ".github/workflows/french-school-foundations.yml"
      ]
    },
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "school-foundations-${{ github.ref }}",
    "cancel-in-progress": false
  },
  "jobs": {
    "lexical": {
      "name": "Lexical (${{ matrix.os }})",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 20,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-24.04",
            "windows-latest"
          ]
        }
      },
      "defaults": {
        "run": {
          "working-directory": "tools/french-school-foundations"
        }
      },
      "env": {
        "CARGO_TERM_COLOR": "always",
        "FORMAT_MODE": "strict"
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1"
        },
        {
          "uses": "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8",
          "with": {
            "toolchain": "1.98.1",
            "components": "rustfmt, clippy"
          }
        },
        {
          "name": "Compiler and formatting",
          "run": "rustc --version --verbose\ncargo --version\nif [ \"$FORMAT_MODE\" = \"prepare\" ]; then cargo fmt; fi\ncargo fmt -- --check",
          "shell": "bash"
        },
        {
          "name": "Execute lexical and independent cases",
          "run": "cargo test --locked --all-targets"
        },
        {
          "name": "Strict Clippy",
          "run": "cargo clippy --locked --all-targets -- -D warnings"
        },
        {
          "name": "Build and exercise actual CLI",
          "run": "cargo build --locked --release\ncargo run --locked --release -- --text \"Les petits chiens jouent.\" > example-school.json\ncargo run --locked --release -- --text \"porte suis les chevaux\" > example-ambiguities.json\ncargo run --locked --release -- --text \"Les zorpules.\" > example-unknown.json\ncargo run --locked --release -- --syntax --text \"Le chien des voisins aboie.\" > example-syntax-noun.json\ncargo run --locked --release -- --syntax --text \"Je suis le voisin.\" > example-syntax-partial.json\ncargo run --locked --release -- --syntax --text \"Le chien et le chat jouent.\" > example-syntax-abstention.json"
        },
        {
          "name": "Record exact executed source and limits",
          "shell": "python",
          "run": "import hashlib, json, os, pathlib\np=pathlib.Path('.')\nfiles=['Cargo.toml','Cargo.lock','README.md','rustfmt.toml']\nfiles+=sorted(str(x).replace('\\\\','/') for folder,pat in [('src','*.rs'),('tests','*.rs'),('data','*.json')] for x in (p/folder).glob(pat))\nmetadata={'head_sha':os.environ['GITHUB_SHA'],'runner_os':os.environ['RUNNER_OS'],'format_mode':os.environ['FORMAT_MODE'],'files':{f:hashlib.sha256((p/f).read_bytes()).hexdigest() for f in files},'grammar_diagnostics':False,'corrections_enabled':False,'syntax_scope':'bounded_structural_hypotheses_opt_in'}\nfor sample in sorted(p.glob('example-*.json')):\n r=json.loads(sample.read_text(encoding='utf-8-sig'))\n lexical=r.get('analyse_lexicale',r)\n assert lexical['corrections']==[]\n if 'analyse_syntaxique' in r:\n  syntax=r['analyse_syntaxique']\n  if sample.name=='example-syntax-noun.json':\n   assert any(lexical['tokens'][h['groupes'][l['source_groupe']]['noyau_token']]['texte']=='chien' for h in syntax['hypotheses'] for l in h['liens'] if l['fonction']=='sujet')\n  if sample.name=='example-syntax-partial.json':\n   assert syntax['statut']=='hypotheses_partielles_avec_reste_non_analyse'\n  if sample.name=='example-syntax-abstention.json':\n   assert syntax['hypotheses']==[]\n metadata[sample.name]={'tokens':len(lexical['tokens']),'known_forms':lexical['formes_indexees'],'syntax':r.get('analyse_syntaxique',{}).get('statut')}\n(p/'validation-provenance.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')"
        },
        {
          "name": "Source, real CLI output and executable",
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "french-school-foundations-${{ runner.os }}",
            "if-no-files-found": "error",
            "path": "tools/french-school-foundations/Cargo.toml\ntools/french-school-foundations/Cargo.lock\ntools/french-school-foundations/README.md\ntools/french-school-foundations/src/\ntools/french-school-foundations/tests/\ntools/french-school-foundations/data/\ntools/french-school-foundations/example-*.json\ntools/french-school-foundations/validation-provenance.json\ntools/french-school-foundations/target/release/french-school-foundations*\ntools/french-school-foundations/rustfmt.toml"
          }
        }
      ]
    }
  }
}
