name: French Windows delivery preview

on:
  push:
    branches: [preview/french-proofing-windows]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: french-delivery-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Portable Windows x64 and CLI acceptance
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@be6bbf3ca5a5de466786908b3986163da7c05314
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
          targets: x86_64-pc-windows-msvc
      - name: Build the portable application and measure original acceptance cases
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: ./packaging/french-preview/build-preview.ps1 -ExpectedSha '${{ github.sha }}'
      - name: Upload executable preview ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: french-windows-preview-${{ github.sha }}
          path: |
            dist/french-preview/*-portable.zip
            dist/french-preview/SHA256SUMS.txt
          if-no-files-found: error
      - name: Upload measured CLI acceptance and build provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: french-delivery-cli-evidence-${{ github.sha }}
          path: |
            dist/french-preview/acceptance-logs/
            dist/french-preview/wordcraft-preview-*/build-manifest.json
          if-no-files-found: warn

  visuals:
    name: Same-SHA French headless pane light and dark
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: storytold/craft-fonts
          ref: b076417b5880bd4154bd22f00695b1d28c6bea83
          path: craft-fonts
          persist-credentials: false
      - uses: storytold/craft-common-actions/actions/checkout-craft-i18n@be6bbf3ca5a5de466786908b3986163da7c05314
      - name: Install build and software-rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev \
            libxi-dev libgtk-3-dev libfontconfig1-dev libfreetype-dev libvulkan1 mesa-vulkan-drivers
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.98.1
      - name: Render original French case and retain existing preview regression
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
          CRAFT_FONTS_REQUIRED: '1'
        run: python3 packaging/french-preview/capture-preview.py
      - name: Upload headless visual proof and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: french-delivery-visuals-${{ github.sha }}
          path: dist/french-preview-visuals/
          if-no-files-found: warn
